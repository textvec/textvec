[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textvec"
version = "3.0"
description = "Supervised text features extraction"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alex Zverianskii", email = "alex@zverianskii.com" },
]
license = { text = "MIT" }
keywords = ["text", "nlp", "vectorization", "scikit-learn"]
dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.10,<1.13",
    "scikit-learn>=1.3,<1.6",
    "gensim>=4.3,<5.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]

[project.urls]
homepage = "https://github.com/textvec/textvec"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
